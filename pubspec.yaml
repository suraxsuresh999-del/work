name: worksphere
description: "WorkSphere - Connect • Collaborate • Grow. A trusted freelance marketplace for Tamil Nadu."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Backend - Supabase
  supabase_flutter: ^2.9.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Authentication
  google_sign_in: ^6.2.2

  # UI Components
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.2.0+3
  readmore: ^3.0.0
  flutter_rating_bar: ^4.0.1
  percent_indicator: ^4.2.3

  # Forms & Validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.0

  # Image Handling
  image_picker: ^1.1.2

  # Face Detection
  google_mlkit_face_detection: ^0.12.0

  # Maps
  google_maps_flutter: ^2.10.0

  # Payments

  # Notifications
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Networking & Utils
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  timeago: ^3.7.0
  # 12.0.0-beta.7 fixes Android plugin registration with AGP 9 when
  # android.builtInKotlin is disabled (Flutter 3.44's default).
  file_picker: ^12.0.0-beta.7
  open_file: ^3.5.9
  permission_handler: ^11.4.0

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  equatable: ^2.0.7

  # Audio
  audioplayers: ^6.1.0

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.5

  # Icons
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^3.0.0
  riverpod_generator: ^2.6.3
  go_router_builder: ^2.8.2
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
